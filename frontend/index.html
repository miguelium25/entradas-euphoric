<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Check-in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="panel hero">
      <p class="eyebrow">Door Control</p>
      <h1>QR Entry Check-in</h1>
      <p class="lead">Scan each guest ticket and mark attendance in Google Sheets in real time.</p>
      <div class="stats" id="stats">
        <article>
          <span class="label">Total</span>
          <strong id="totalCount">-</strong>
        </article>
        <article>
          <span class="label">Checked in</span>
          <strong id="checkedCount">-</strong>
        </article>
        <article>
          <span class="label">Pending</span>
          <strong id="pendingCount">-</strong>
        </article>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Scanner</h2>
        <button id="startScanBtn" type="button">Start camera</button>
      </div>

      <div id="reader" class="reader"></div>

      <form id="manualForm" class="manual-form">
        <label for="manualCode">Manual code input</label>
        <div class="manual-row">
          <input id="manualCode" name="manualCode" type="text" placeholder="EVT2026-001" autocomplete="off" required>
          <button type="submit">Check in</button>
        </div>
      </form>
    </section>

    <section class="panel status-panel">
      <h2>Last validation</h2>
      <div id="statusCard" class="status-card idle">
        <p class="status-title">Waiting for first scan</p>
        <p class="status-detail">When a QR code is scanned, the result appears here.</p>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
